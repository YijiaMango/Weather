<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Windy</title>
  <script src="https://unpkg.com/leaflet@1.4.0/dist/leaflet.js"></script>
  <script src="https://api.windy.com/assets/map-forecast/libBoot.js"></script>
  <style>
    html, body, #windy {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #080d1a;
    }
    /* 進度條／播放改由主頁拉桿控制；logo 必須可見可點 */
    #windy #bottom,
    #windy #embed-zoom,
    #windy .leaflet-control-zoom,
    #windy #progress-bar,
    #windy .progress-bar,
    #windy [class*="progress-bar"] {
      display: none !important;
    }
    #windy #logo-wrapper {
      top: auto !important;
      bottom: 8px !important;
      left: 8px !important;
    }
  </style>
</head>
<body>
  <div id="windy"></div>
  <script>
    let api = null;
    let lastPos = null;
    let pending = null;
    let acked = false;

    function ping() {
      if (acked) return;
      window.parent.postMessage({ type: "windy-ready" }, "*");
    }
    ping();
    const pingTimer = setInterval(ping, 400);

    function apply(msg) {
      if (!msg || !api) return;
      const { store, map } = api;
      if (msg.timestamp) store.set("timestamp", msg.timestamp);
      if (msg.lat == null || msg.lon == null) return;
      const moved = !lastPos || Math.abs(msg.lat - lastPos.lat) > 0.015 || Math.abs(msg.lon - lastPos.lon) > 0.015;
      if (moved) {
        map.panTo([msg.lat, msg.lon]);
        lastPos = { lat: msg.lat, lon: msg.lon };
      }
    }

    window.addEventListener("message", (e) => {
      if (e.source !== window.parent) return;
      const msg = e.data;
      if (!msg || (msg.type !== "windy-sync" && msg.type !== "windy-init")) return;
      pending = msg;
      acked = true;
      clearInterval(pingTimer);
      if (api) {
        apply(msg);
        return;
      }
      if (!msg.key || typeof windyInit !== "function") return;
      windyInit({
        key: msg.key,
        lat: msg.lat,
        lon: msg.lon,
        zoom: msg.zoom || 8,
        overlay: msg.overlay || "rain",
        timestamp: msg.timestamp || Date.now(),
        hourFormat: "24h",
        lang: "zh"
      }, (windyAPI) => {
        api = windyAPI;
        lastPos = { lat: msg.lat, lon: msg.lon };
        apply(pending || msg);
      });
    });

    window.parent.postMessage({ type: "windy-ready" }, "*");
  </script>
</body>
</html>
